<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Red Dot Press</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/assets/reddot-logo.png">
    <!-- CRITICAL: Apply theme BEFORE CSS loads to prevent FOUC -->
    <script>
        (function() {
            // Theme (dark/light) — light is the default; dark only if explicitly chosen
            if (localStorage.getItem('reader_theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/otr-page.css?v=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background-color: var(--color-background); }
        body {
            background-color: var(--color-background);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .logo-link { display: block; line-height: 0; }
        .logo {
            display: block;
            width: clamp(160px, 40vw, 300px);
            max-width: 512px;
            height: auto;
        }
        .contact {
            display: inline-block;
            margin-top: 24px;
            font-family: "Courier New", Courier, monospace;
            font-size: 12pt;
            font-weight: 700;
            text-decoration: underline;
            letter-spacing: normal;
            color: var(--color-text-primary);
        }

        .message {
            margin-top: 24px;
            font-family: "Courier New", Courier, monospace;
            font-size: 12pt;
            color: var(--color-text-primary);
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <a class="logo-link" href="/">
        <img class="logo" src="/assets/reddot-logo.png" alt="Red Dot Press" width="512" height="512">
    </a>
    <p class="message">That page doesn't exist.</p>
    <nav class="links" aria-label="Site">
        <a class="contact" href="/">HOME</a>
        <a class="contact" href="/off-the-record/">OFF-THE-RECORD</a>
        <a class="contact" href="/anthony-fenech/">ANTHONY FENECH</a>
    </nav>
</body>
</html>
