<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFF-THE-RECORD — Red Dot Press</title>
    <meta name="description" content="Red Dot Press, publisher of OFF-THE-RECORD by Anthony Fenech.">
    <link rel="icon" type="image/png" href="/assets/reddot-logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background-color: #FF0000; }
        body {
            background-color: #FF0000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-family: "Courier New", Courier, monospace;
            color: #000000;
        }
        h1 {
            font-size: 18pt;
            font-weight: bold;
            letter-spacing: normal;
        }
        .byline {
            margin-top: 12px;
            font-size: 12pt;
        }
        .get-the-book {
            display: inline-block;
            margin-top: 24px;
            font-size: 12pt;
            font-weight: bold;
            text-decoration: underline;
            color: #000000;
        }
        .logo-link { display: block; line-height: 0; margin-top: 40px; }
        .logo {
            display: block;
            width: clamp(80px, 18vw, 120px);
            max-width: 512px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>OFF-THE-RECORD</h1>
    <p class="byline">by Anthony Fenech</p>
    <a class="get-the-book" href="https://offrecordbook.com/downloadpage.html">Get the book</a>
    <a class="logo-link" href="/">
        <img class="logo" src="/assets/reddot-logo.png" alt="Red Dot Press — OFF-THE-RECORD" width="512" height="512">
    </a>
</body>
</html>
