<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Dot Press</title>
    <meta name="description" content="Red Dot Press, publisher of OFF-THE-RECORD by Anthony Fenech.">
    <link rel="icon" type="image/png" href="/assets/reddot-logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background-color: #FF0000; }
        body {
            background-color: #FF0000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .logo-link { display: block; line-height: 0; }
        .logo {
            display: block;
            width: clamp(160px, 40vw, 300px);
            max-width: 512px;
            height: auto;
        }
        .contact {
            display: inline-block;
            margin-top: 24px;
            font-family: "Courier New", Courier, monospace;
            font-size: 12pt;
            font-weight: bold;
            text-decoration: underline;
            letter-spacing: normal;
            color: #000000;
        }
    </style>
</head>
<body>
    <a class="logo-link" href="/off-the-record/">
        <img class="logo" src="/assets/reddot-logo.png" alt="Red Dot Press — OFF-THE-RECORD" width="512" height="512">
    </a>
    <a class="contact" href="mailto:marketing@reddotbooks.com">CONTACT</a>
</body>
</html>
