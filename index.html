<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Dot Press</title>
    <meta name="description" content="Red Dot Press">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        body {
            background-color: #5C1F2E;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            font-family: 'Cormorant Garamond', 'Garamond', 'Didot', 'Georgia', serif;
            font-size: 2rem;
            letter-spacing: 0.6em;
            font-weight: 300;
            padding-left: 0.6em;
            transition: opacity 0.2s ease;
        }
        a:hover, a:focus { opacity: 0.7; }
        @media (max-width: 600px) {
            a { font-size: 1.5rem; letter-spacing: 0.5em; padding-left: 0.5em; }
        }
    </style>
</head>
<body>
    <a href="mailto:info@reddotbooks.com">CONTACT</a>
</body>
</html>
